[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hermetic-code-sandbox-isolator"
version = "0.1.0"
description = "Lightweight chroot and process-namespace container manager providing reproducible, network-isolated Python execution environments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-hermetic-code-sandbox-isolator = "agent_hermetic_code_sandbox_isolator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_hermetic_code_sandbox_isolator*"]
